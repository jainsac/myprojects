<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f8"><meta name="description" content="Cuddl — meet people with intention.">
<title>Cuddl — Meet with intention</title>
<style>
:root{--red:#e85b6a;--red2:#f48b96;--rose:#fff3f5;--ink:#252225;--muted:#7e7377;--line:#f0dfe2;--card:#fff;--shadow:0 16px 40px rgba(87,35,43,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#fff;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;max-width:520px;margin:auto;background:#fff}.top{height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f7ecee;position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);z-index:10}.brand{font-size:25px;font-weight:800;letter-spacing:-1px;color:var(--red)}.icon{width:38px;height:38px;border-radius:50%;background:var(--rose);color:var(--red);display:grid;place-items:center}.view{padding:18px 16px 88px}.hero{padding:18px 2px 8px}.eyebrow{color:var(--red);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px}.h1{font-size:31px;line-height:1.08;margin:7px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5}.profile-card{border:1px solid var(--line);border-radius:26px;overflow:hidden;background:#fff;box-shadow:var(--shadow);margin-top:18px}.photo{height:430px;background:linear-gradient(135deg,#ffd9de,#fff1f3);display:grid;place-items:center;position:relative}.avatar{width:170px;height:170px;border-radius:50%;background:linear-gradient(145deg,#f5a7b0,#e55c6b);display:grid;place-items:center;color:white;font-size:62px;font-weight:800;box-shadow:0 20px 50px rgba(205,75,91,.22)}.badge{position:absolute;left:14px;top:14px;background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:99px;color:var(--red);font-size:12px;font-weight:700}.dots{position:absolute;right:14px;top:14px;background:#fff;border-radius:99px;padding:7px 10px}.info{padding:18px}.name{font-size:24px;font-weight:800}.meta{color:var(--muted);font-size:13px;margin-top:4px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--rose);color:#9b505b;padding:7px 10px;border-radius:99px;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 18px 18px}.act{height:52px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:20px}.act.like{background:var(--red);color:#fff;border-color:var(--red)}.section{margin-top:22px}.section h2{font-size:17px;margin:0 0 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:14px;border:1px solid var(--line);border-radius:18px;background:#fff}.tile b{display:block;margin-bottom:5px;font-size:14px}.tile span{font-size:12px;color:var(--muted);line-height:1.4}.match{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:18px;margin-bottom:9px}.mini{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#ffd7dd,#f7a0aa);display:grid;place-items:center;color:#fff;font-weight:800}.grow{flex:1}.pill{font-size:11px;color:var(--red);background:var(--rose);padding:6px 9px;border-radius:99px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:rgba(255,255,255,.96);border-top:1px solid #f2e4e6;display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav button{background:transparent;color:#9b8d91;font-size:11px}.nav button.active{color:var(--red);font-weight:800}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}.panel{border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #f5eaec}.row:last-child{border:0}.toggle{width:46px;height:27px;border-radius:99px;background:#ddd;position:relative}.toggle.on{background:var(--red)}.toggle:after{content:'';width:21px;height:21px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s}.toggle.on:after{left:22px}.cta{width:100%;height:50px;border-radius:16px;background:var(--red);color:#fff;font-weight:800;margin-top:14px}.ghost{width:100%;height:46px;border-radius:15px;background:var(--rose);color:var(--red);font-weight:700;margin-top:9px}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;outline:none}.input:focus{border-color:var(--red)}.modal{position:fixed;inset:0;background:rgba(34,18,21,.35);z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:min(520px,100%);margin:auto;border-radius:28px 28px 0 0;padding:20px;max-height:86vh;overflow:auto}.close{float:right;background:var(--rose);color:var(--red);width:34px;height:34px;border-radius:50%}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#272326;color:#fff;padding:11px 15px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hidden{display:none}
</style></head>
<body>
<div class="app">
<header class="top"><div class="brand">Cuddl</div><button class="icon" onclick="openModal('safety')">♡</button></header>
<main id="view" class="view"></main>
<nav class="nav">
<button data-tab="discover" onclick="tab('discover')"><i>♡</i>Discover</button>
<button data-tab="likes" onclick="tab('likes')"><i>♥</i>Likes</button>
<button data-tab="matches" onclick="tab('matches')"><i>◌</i>Matches</button>
<button data-tab="dates" onclick="tab('dates')"><i>✦</i>Dates</button>
<button data-tab="profile" onclick="tab('profile')"><i>☺</i>Profile</button>
</nav>
</div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const people=[
{name:'Aanya',age:27,city:'Delhi',vibe:'Looking for something real',initial:'A',tags:['Coffee','Travel','Dogs'],score:94},
{name:'Riya',age:29,city:'Gurugram',vibe:'Slow dates, deep talks',initial:'R',tags:['Books','Yoga','Music'],score:91},
{name:'Meera',age:26,city:'Noida',vibe:'Kindness > everything',initial:'M',tags:['Art','Food','Mountains'],score:88}
];
let state={tab:'discover',idx:0,likes:[],matches:[people[1]],incognito:false,screenLock:true};
const v=document.getElementById('view');
function tab(t){state.tab=t;render()}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
 if(state.tab==='discover')discover(); if(state.tab==='likes')likes(); if(state.tab==='matches')matches(); if(state.tab==='dates')dates(); if(state.tab==='profile')profile();
}
function discover(){
 let p=people[state.idx%people.length];
 v.innerHTML=`<div class="hero"><div class="eyebrow">Made for connection</div><div class="h1">Someone worth knowing<br>might be one tap away.</div><div class="sub">Intentional matching, privacy-first profiles and dates designed around real chemistry.</div></div>
 <div class="profile-card"><div class="photo"><div class="badge">✓ Verified</div><div class="dots">•••</div><div class="avatar">${p.initial}</div></div><div class="info"><div class="name">${p.name}, ${p.age}</div><div class="meta">⌖ ${p.city} · 3 km away · Active today</div><p class="sub">“${p.vibe}.”</p><div class="tags">${p.tags.map(x=>'<span class="tag">'+x+'</span>').join('')}<span class="tag">94% vibe</span></div></div><div class="actions"><button class="act" onclick="pass()">×</button><button class="act like" onclick="like()">♥</button><button class="act" onclick="openModal('profile')">↗</button></div></div>
 <div class="section"><h2>Why you may click</h2><div class="grid"><div class="tile"><b>94% vibe</b><span>Values + interests + conversation style</span></div><div class="tile"><b>Intent aligned</b><span>Both open to a serious relationship</span></div><div class="tile"><b>Safe to meet</b><span>Profile and photo verification available</span></div><div class="tile"><b>Fresh connection</b><span>No repeated profile recycling</span></div></div></div>`;
}
function like(){let p=people[state.idx%people.length];state.likes.push(p);state.matches.push(p);toast('It’s a like 💗');state.idx++;render()}
function pass(){toast('Passed — we’ll tune your suggestions');state.idx++;render()}
function likes(){v.innerHTML='<div class="hero"><div class="eyebrow">Your likes</div><div class="h1">People you felt a spark with.</div></div>'+(state.likes.length?state.likes.map(p=>matchRow(p,'You liked them')).join(''):'<div class="panel"><b>No likes yet.</b><p class="sub">When someone catches your eye, they’ll appear here.</p></div>')}
function matches(){v.innerHTML='<div class="hero"><div class="eyebrow">Mutual connection</div><div class="h1">Your matches.</div><div class="sub">Start with something better than “hey”. Cuddl can help.</div></div>'+state.matches.slice(-6).map(p=>matchRow(p,'94% vibe')).join('')+'<div class="section"><h2>Conversation tools</h2><div class="grid"><div class="tile" onclick="openModal(\'wingman\')"><b>✦ AI Wingman</b><span>Personalized openers from both profiles</span></div><div class="tile" onclick="openModal(\'capsule\')"><b>💌 Memory Capsule</b><span>Save a shared moment for later</span></div></div></div>'}
function matchRow(p,pill){return `<div class="match"><div class="mini">${p.initial}</div><div class="grow"><b>${p.name}, ${p.age}</b><div class="sub">${p.city} · ${p.vibe}</div></div><span class="pill">${pill}</span></div>`}
function dates(){v.innerHTML=`<div class="hero"><div class="eyebrow">Date Studio</div><div class="h1">Turn a match into a memory.</div><div class="sub">Plan a first date without the awkward logistics.</div></div>
<div class="panel"><b>✦ Chemistry Date</b><p class="sub">Cuddl combines both your interests, preferred pace and location to suggest a low-pressure plan.</p><button class="cta" onclick="toast('3 date ideas created ✦')">Create date ideas</button></div>
<div class="panel"><b>🛟 Safe Date</b><div class="row"><span>Share plan with trusted contact</span><button class="toggle on"></button></div><div class="row"><span>Arrival check-in</span><button class="toggle on"></button></div><div class="row"><span>Private emergency exit</span><button class="toggle on"></button></div></div>
<div class="panel"><b>Unique idea — Date Capsule</b><p class="sub">Both people answer one question before meeting. The answers stay sealed until after the date, then unlock together.</p><button class="ghost" onclick="toast('Capsule created 💌')">Create a capsule</button></div>`}
function profile(){v.innerHTML=`<div class="hero"><div class="eyebrow">Your space</div><div class="h1">Your profile & privacy.</div></div>
<div class="panel"><div class="row"><div><b>Photo & identity verification</b><div class="sub">Show a verified badge when complete</div></div><span class="pill">Not set</span></div><button class="cta" onclick="toast('Verification flow opened')">Start verification</button></div>
<div class="panel"><div class="row"><div><b>Incognito discovery</b><div class="sub">Only people you like can discover you</div></div><button class="toggle ${state.incognito?'on':''}" onclick="state.incognito=!state.incognito;render()"></button></div>
<div class="row"><div><b>Screenshot protection</b><div class="sub">Protected surfaces are capture-blocked on supported devices</div></div><button class="toggle on"></button></div>
<div class="row"><div><b>Block contacts</b><div class="sub">Keep selected people from discovering you</div></div><button class="icon" onclick="openModal('blocks')">›</button></div>
<div class="row"><div><b>Safety center</b><div class="sub">Report, block, date safety and privacy controls</div></div><button class="icon" onclick="openModal('safety')">›</button></div></div>
<div class="section"><h2>Ideas that make Cuddl different</h2><div class="grid"><div class="tile"><b>Intent Mirror</b><span>Shows where two people agree or differ on relationship pace.</span></div><div class="tile"><b>Conversation Weather</b><span>Detects whether a chat is warm, stalled or one-sided without exposing private messages publicly.</span></div><div class="tile"><b>Kindness Signal</b><span>Private feedback after dates about respect, punctuality and boundaries.</span></div><div class="tile"><b>Serendipity Mode</b><span>One curated surprise match weekly outside your normal filters.</span></div></div></div>`}
function openModal(type){let b=document.getElementById('modalBody');let content={profile:'<h2>Profile preview</h2><p class="sub">Full profile view with prompts, voice intro, interests, relationship intent and verification details.</p><button class="cta" onclick="closeModal()">Done</button>',wingman:'<h2>✦ AI Wingman</h2><p class="sub">Based on shared interests, try: “You both picked mountains — sunrise trek or cozy cabin weekend?”</p><button class="cta" onclick="toast(\'Opener copied\');closeModal()">Use opener</button>',capsule:'<h2>💌 Date Capsule</h2><p class="sub">Question: “What makes you feel most cared for?” Your answer stays sealed until you both complete the date.</p><button class="cta" onclick="toast(\'Capsule saved\');closeModal()">Seal answer</button>',safety:'<h2>Safety Center</h2><div class="row"><span>Report / block</span><b>›</b></div><div class="row"><span>Photo & identity verification</span><b>›</b></div><div class="row"><span>Date safety check-in</span><b>›</b></div><p class="sub">Cuddl cannot guarantee someone’s identity or behavior. Never send money, passwords or sensitive documents to a match.</p>',blocks:'<h2>Block contacts</h2><p class="sub">Import selected contacts so Cuddl can avoid showing your profile to them.</p><input class="input" placeholder="Search contact"><button class="cta" onclick="toast(\'Contact block list saved\');closeModal()">Save block list</button>'};b.innerHTML=content[type]||'';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
render();
</script></body></html>
