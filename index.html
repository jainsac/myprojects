<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f8"><meta name="description" content="Cuddl — connect through chemistry, play and music."><title>Cuddl — Social Dating</title>
<style>
:root{--r:#e85b6a;--r2:#f58a96;--rose:#fff2f4;--ink:#292326;--muted:#7f7377;--line:#f0dfe2;--shadow:0 14px 38px rgba(90,35,45,.09)}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:540px;min-height:100vh;margin:auto;background:#fff}.top{height:64px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 17px;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid #f6eaec}.brand{font-size:26px;font-weight:850;letter-spacing:-1.2px;color:var(--r)}.icon{width:38px;height:38px;border-radius:50%;background:var(--rose);color:var(--r);display:grid;place-items:center}.view{padding:18px 16px 92px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--r);font-weight:800}.h1{font-size:30px;line-height:1.08;font-weight:850;letter-spacing:-.8px;margin:7px 0}.sub{font-size:13px;line-height:1.5;color:var(--muted)}.hero{padding:10px 2px 8px}.panel,.tile,.room,.game,.profile{border:1px solid var(--line);background:#fff;border-radius:21px;box-shadow:var(--shadow)}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:14px;box-shadow:none}.tile b{display:block;font-size:14px;margin-bottom:5px}.tile span{font-size:12px;color:var(--muted);line-height:1.35}.chips{display:flex;gap:8px;overflow:auto;padding:4px 1px 8px}.chip{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);border-radius:99px;background:#fff;color:#6f6266;font-size:12px}.chip.active{background:var(--rose);border-color:#f4cbd0;color:var(--r);font-weight:800}.room{padding:14px;margin:10px 0;box-shadow:none}.roomtop{display:flex;align-items:center;gap:10px}.roomicon{width:46px;height:46px;border-radius:15px;background:var(--rose);display:grid;place-items:center;font-size:23px}.grow{flex:1}.room b{font-size:14px}.roommeta{font-size:11px;color:var(--muted);margin-top:3px}.avatars{display:flex;align-items:center;margin-top:13px}.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#f7a5af,#e85b6a);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;border:2px solid #fff;margin-left:-6px;position:relative}.av:first-child{margin-left:0}.live:after{content:'';position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:#34b56f;border:2px solid #fff}.join{padding:9px 13px;border-radius:13px;background:var(--r);color:#fff;font-weight:800;font-size:12px}.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:var(--rose);color:#9b505b;font-size:11px;margin:3px}.profile{padding:15px;box-shadow:none}.profilehead{display:flex;gap:12px;align-items:center}.bigav{width:62px;height:62px;border-radius:20px;background:linear-gradient(145deg,#f7a5af,#e85b6a);color:#fff;display:grid;place-items:center;font-weight:850;font-size:24px}.actions{display:flex;gap:8px;margin-top:13px}.btn{height:43px;border-radius:14px;padding:0 14px;background:var(--r);color:#fff;font-weight:800;font-size:12px}.ghost{background:var(--rose);color:var(--r)}.board{display:grid;gap:7px;margin-top:14px}.ttt{grid-template-columns:repeat(3,1fr)}.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--rose);border-radius:16px;font-size:30px;font-weight:900;color:var(--r)}.snake{height:270px;background:#fff7f8;border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}.snake canvas{width:100%;height:100%}.roombar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{background:var(--rose);color:var(--r);width:35px;height:35px;border-radius:50%}.modal{position:fixed;inset:0;background:rgba(34,18,21,.38);z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(540px,100%);max-height:90vh;overflow:auto;margin:auto;background:#fff;border-radius:28px 28px 0 0;padding:19px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);height:72px;background:rgba(255,255,255,.97);border-top:1px solid #f2e4e6;display:grid;grid-template-columns:repeat(5,1fr);z-index:30}.nav button{background:transparent;color:#998b90;font-size:10px}.nav button.active{color:var(--r);font-weight:850}.nav i{font-style:normal;display:block;font-size:20px;margin-bottom:2px}.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:#282326;color:#fff;border-radius:99px;padding:11px 15px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translate(-50%,0)}.cheer{padding:8px 11px;border-radius:12px;background:#fff1f3;color:#e85b6a;font-weight:800;font-size:11px}.cheer.on{background:#e85b6a;color:#fff}.score{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 9px;color:var(--r);font-weight:800}
</style></head><body>
<div class="app"><header class="top"><div class="brand">Cuddl</div><button class="icon" onclick="safety()">♡</button></header><main id="view" class="view"></main>
<nav class="nav"><button data-t="discover" onclick="tab('discover')"><i>♡</i>Discover</button><button data-t="lounge" onclick="tab('lounge')"><i>🎮</i>Lounge</button><button data-t="matches" onclick="tab('matches')"><i>◌</i>Matches</button><button data-t="dates" onclick="tab('dates')"><i>✦</i>Dates</button><button data-t="profile" onclick="tab('profile')"><i>☺</i>Profile</button></nav></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeM()"><div class="sheet"><button class="close" onclick="closeM()">×</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const people=[{n:'Aanya',a:27,c:'Delhi',i:'A',tags:['Music','Travel','Dogs'],score:94},{n:'Riya',a:29,c:'Gurugram',i:'R',tags:['Books','Yoga','Music'],score:91},{n:'Meera',a:26,c:'Noida',i:'M',tags:['Art','Food','Mountains'],score:88},{n:'Kabir',a:28,c:'Delhi',i:'K',tags:['Chess','Karaoke','Travel'],score:90}];
let S={tab:'discover',idx:0,likes:[],matches:[people[1]],room:null,game:null,ttt:['','',''],turn:'X',score:0,city:'Delhi',cheers:{Aanya:128,Riya:74,Meera:211,Kabir:96},cheered:{}};
const V=document.getElementById('view');
function tab(t){S.tab=t;render()}
function render(){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.t===S.tab));({discover,lounge,matches,dates,profile}[S.tab]||discover)()}
function discover(){let p=people[S.idx%people.length];V.innerHTML=`<div class="hero"><div class="eyebrow">Dating, but more alive</div><div class="h1">Meet through moments, not just swipes.</div><div class="sub">Discover people, then play, listen, talk and let chemistry happen naturally.</div></div><div class="panel"><div class="eyebrow">Daily Spark</div><div class="profilehead"><div class="bigav">${p.i}</div><div class="grow"><b>${p.n}, ${p.a} ✓</b><div class="sub">⌖ ${p.c} · Active today</div><div>${p.tags.map(t=>'<span class="tag">'+t+'</span>').join('')}</div></div><span class="score">${p.score}%</span></div><p class="sub">“Looking for someone kind, curious and ready for real conversations.”</p><div class="actions"><button class="btn ghost" onclick="skip()">Pass</button><button class="btn" onclick="like()">♥ Send Spark</button><button class="btn ghost" onclick="openProfile(${S.idx%people.length})">View</button></div></div><div class="hero"><div class="eyebrow">Try something different</div></div><div class="grid"><div class="tile" onclick="tab('lounge')"><b>🎮 Play Together</b><span>Ludo, Chess, Snake, Tic-Tac-Toe, quizzes and more.</span></div><div class="tile" onclick="tab('lounge')"><b>🎵 Music Together</b><span>Karaoke, duets, open mic and listening rooms.</span></div><div class="tile" onclick="openM('roulette')"><b>🎲 Social Roulette</b><span>Meet compatible people through a 10-minute activity.</span></div><div class="tile" onclick="openM('capsule')"><b>💌 Chemistry Capsule</b><span>Answer privately, reveal together after meeting.</span></div></div>`}
function skip(){S.idx++;toast('Passed — suggestions tuned');render()}
function like(){let p=people[S.idx%people.length];S.likes.push(p);if(!S.matches.find(x=>x.n===p.n))S.matches.push(p);S.idx++;toast('Spark sent 💗');render()}
function lounge(){let type=S.loungeType||'all';V.innerHTML=`<div class="hero"><div class="eyebrow">Cuddl Social Lounge</div><div class="h1">Meet people while doing something you enjoy.</div><div class="sub">Profiles appear as small circles inside rooms. Tap anyone to visit their profile and continue the connection.</div></div><div class="chips"><button class="chip ${type==='all'?'active':''}" onclick="S.loungeType='all';render()">All</button><button class="chip ${type==='games'?'active':''}" onclick="S.loungeType='games';render()">🎮 Games</button><button class="chip ${type==='music'?'active':''}" onclick="S.loungeType='music';render()">🎵 Music</button><button class="chip ${type==='social'?'active':''}" onclick="S.loungeType='social';render()">👥 Social</button></div>${rooms(type)}<div class="panel"><b>Create your own room</b><div class="sub">Choose an activity, capacity and visibility. Hosts can mute, remove or block participants.</div><div class="actions"><button class="btn" onclick="openM('create')">+ Create room</button><button class="btn ghost" onclick="openM('roulette')">Social Roulette</button></div></div>`}
function avs(ids){return '<div class="avatars">'+ids.map((x,j)=>`<button class="av ${j<2?'live':''}" onclick="openProfile(${x})">${people[x].i}</button>`).join('')+'</div>'}
function rooms(t){let data=[['games','🎲','Rapid Fire + Truth & Dare','8/12 · 4 active',[0,1,3]],['games','♟️','Chess Café','6/8 · 2 playing',[3,1,2]],['games','🎯','Ludo After Work','12/16 · 6 active',[1,2,3,0]],['music','🎤','Bollywood Karaoke','14/20 · 5 on stage',[0,2,3,1]],['music','🎶','Acoustic Open Mic','9/15 · 2 singing',[2,3,0]],['music','🎧','Listen Together — Indie','18/30 · listening',[1,0,2,3]],['social','✨','New in {{CITY}} Mixer','20/30 · 8 chatting',[0,1,2,3]],['social','🧩','Compatibility Quiz Night','10/12 · 4 playing',[2,1,3]]];return data.filter(x=>t==='all'||x[0]===t).map(x=>`<div class="room"><div class="roomtop"><div class="roomicon">${x[1]}</div><div class="grow"><b>${x[2]}</b><div class="roommeta">${x[3]}</div></div><button class="join" onclick="joinRoom('${x[2]}','${x[0]}')">Join</button></div>${avs(x[4])}<div class="roommeta">Tap a circle to see that participant's profile.</div></div>`).join('')}
function joinRoom(name,type){S.room={name,type};openM('room')}
function cheer(name){S.cheers[name]=(S.cheers[name]||0)+1;S.cheered[name]=true;toast('Cheered '+name+' 🎉');renderRoom()}
function renderRoom(){if(document.getElementById('modal').classList.contains('open')){document.getElementById('modalBody').innerHTML=roomUI()}}
function roomUI(){let r=S.room;return `<div class="roombar"><div><div class="eyebrow">${r.type==='music'?'Music room':'Game room'}</div><h2 style="margin:5px 0">${r.name}</h2></div></div><div class="panel"><b>Participants</b>${avs([0,1,2,3])}<p class="sub">Aanya is singing · Riya is watching · Kabir is playing. Tap an avatar to visit profile.</p><div class="panel"><b>🎉 Performance cheers</b><p class="sub">Cheer someone when you love their performance. Cheers are added to their public profile.</p><div class="actions"><button class="cheer ${S.cheered.Aanya?'on':''}" onclick="cheer('Aanya')">🎉 Aanya · ${S.cheers.Aanya}</button><button class="cheer ${S.cheered.Riya?'on':''}" onclick="cheer('Riya')">🎉 Riya · ${S.cheers.Riya}</button><button class="cheer ${S.cheered.Meera?'on':''}" onclick="cheer('Meera')">🎉 Meera · ${S.cheers.Meera}</button></div></div></div>${r.type==='music'?'<div class="panel"><h3>🎤 Live stage</h3><div class="tile"><b>Now performing: Aanya</b><span>♪ Dil se… · 01:18</span></div><div class="actions"><button class="btn" onclick="toast(\'Joined the singing queue 🎤\')">Join queue</button><button class="btn ghost" onclick="toast(\'Duet request sent\')">Request duet</button></div></div>':'<div class="grid"><div class="tile" onclick="startGame(\'ttt\')"><b>⭕ Tic-Tac-Toe</b><span>Quick 1-on-1</span></div><div class="tile" onclick="startGame(\'snake\')"><b>🐍 Snake</b><span>Beat the room score</span></div><div class="tile" onclick="startGame(\'quiz\')"><b>🧠 Rapid Quiz</b><span>5 quick questions</span></div><div class="tile" onclick="openM(\'truth\')"><b>💬 Truth & Dare</b><span>Safe prompts</span></div></div>'}
function startGame(g){S.game=g;closeM();openM('game')}
function game(){if(S.game==='ttt')return ttt();if(S.game==='snake')return snake();return quiz()}
function ttt(){let cells=S.ttt.map((x,i)=>`<button class="cell" onclick="move(${i})">${x}</button>`).join('');return `<h2>⭕ Tic-Tac-Toe</h2><div class="sub">You are X · opponent is Riya</div><div class="board ttt">${cells}</div><button class="btn ghost" style="margin-top:12px" onclick="S.ttt=['','',''];S.turn='X';gameRefresh()">Reset</button>`}
function move(i){if(S.ttt[i])return;S.ttt[i]=S.turn;if(win(S.ttt,S.turn)){toast(S.turn==='X'?'You won!':'Riya won!');return}S.turn=S.turn==='X'?'O':'X';if(S.turn==='O'){let empty=S.ttt.map((x,i)=>x?null:i).filter(x=>x!==null);if(empty.length){S.ttt[empty[Math.floor(Math.random()*empty.length)]]='O';S.turn='X'}}gameRefresh()}
function win(a,p){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(q=>q.every(i=>a[i]===p))}
function snake(){return `<h2>🐍 Snake Sprint</h2><div class="sub">Beat the room score in 30 seconds. Use arrow keys or swipe.</div><div class="snake"><canvas id="cv" width="500" height="270"></canvas></div><button class="btn" style="margin-top:12px" onclick="runSnake()">Start / Restart</button>`}
function runSnake(){let c=document.getElementById('cv'),x=c.getContext('2d'),W=500,H=270,s=[{x:100,y:100}],d={x:20,y:0},food={x:300,y:100},score=0;function draw(){x.clearRect(0,0,W,H);x.fillStyle='#e85b6a';x.beginPath();x.arc(food.x,food.y,7,0,7);x.fill();s.forEach((p,i)=>{x.fillStyle=i?'#f4a0aa':'#e85b6a';x.fillRect(p.x,p.y,18,18)});x.fillStyle='#7f7377';x.font='14px system-ui';x.fillText('Score '+score,15,23)}function loop(){let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>W-18||h.y>H-18||s.some(p=>p.x===h.x&&p.y===h.y)){toast('Game over · score '+score);return}s.unshift(h);if(Math.abs(h.x-food.x)<18&&Math.abs(h.y-food.y)<18){score++;food={x:Math.floor(Math.random()*24)*20,y:Math.floor(Math.random()*12)*20}}else s.pop();draw();setTimeout(loop,130)}document.onkeydown=e=>{if(e.key==='ArrowUp'&&d.y===0)d={x:0,y:-20};if(e.key==='ArrowDown'&&d.y===0)d={x:0,y:20};if(e.key==='ArrowLeft'&&d.x===0)d={x:-20,y:0};if(e.key==='ArrowRight'&&d.x===0)d={x:20,y:0}};loop()}
function quiz(){return `<h2>🧠 Rapid Quiz</h2><div class="panel"><b>Question 1/5</b><p>Pick your ideal first date:</p><div class="grid"><button class="tile" onclick="toast('Aisha also picked this 💗')">☕ Café</button><button class="tile" onclick="toast('Interesting choice!')">🌄 Outdoors</button><button class="tile" onclick="toast('Great energy!')">🎵 Live music</button><button class="tile" onclick="toast('Food is always a conversation starter')">🍜 Food walk</button></div></div>`}
function gameRefresh(){document.getElementById('modalBody').innerHTML=game()}
function matches(){V.innerHTML='<div class="hero"><div class="eyebrow">Mutual connections</div><div class="h1">Your matches.</div><div class="sub">Continue the chemistry through chat, games, calls or a date.</div></div>'+S.matches.map((p,i)=>`<div class="profile" style="margin:10px 0"><div class="profilehead"><div class="bigav">${p.i}</div><div class="grow"><b>${p.n}, ${p.a} ✓</b><div class="sub">${p.c} · ${p.score}% compatibility</div></div></div><div class="actions"><button class="btn" onclick="toast('Chat opened')">Chat</button><button class="btn ghost" onclick="joinRoom('Play with ${p.n}','games')">Play</button><button class="btn ghost" onclick="openProfile(${i%people.length})">Profile</button></div></div>`).join('')+`<div class="panel"><b>✦ AI Wingman</b><p class="sub">Suggestion only — Cuddl never sends messages without your approval.</p><button class="btn" onclick="openM('wingman')">Create opener</button></div>`}
function dates(){V.innerHTML='<div class="hero"><div class="eyebrow">Date Studio</div><div class="h1">Turn a connection into a memory.</div><div class="sub">Build a low-pressure plan around shared interests, budget and location.</div></div><div class="panel"><b>✦ Chemistry Date</b><p class="sub">Café + live acoustic set · 90 min · ₹800–₹1,200 · public venue</p><button class="btn" onclick="toast('3 date ideas created ✦')">Create ideas</button></div><div class="panel"><b>🛟 Date Safety</b><div class="sub">Share plan, trusted contact and arrival check-in.</div><button class="btn" style="margin-top:10px" onclick="openM('safety')">Open Safety Center</button></div><div class="panel"><b>💌 Date Capsule</b><p class="sub">Both answer one question. Answers unlock together after the date.</p><button class="btn ghost" onclick="openM('capsule')">Create capsule</button></div>'}
function profile(){V.innerHTML='<div class="hero"><div class="eyebrow">Your space</div><div class="h1">Profile, privacy & trust.</div></div><div class="panel"><div class="profilehead"><div class="bigav">S</div><div><b>Your profile</b><div class="sub">82% complete · Add voice intro</div></div></div><div class="actions"><button class="btn" onclick="toast(\'Profile editor opened\')">Edit profile</button><button class="btn ghost" onclick="openM(\'verify\')">Verify</button></div></div><div class="panel"><div class="roombar"><b>Privacy controls</b></div><div class="roommeta">Incognito · screenshot protection · block contacts · hide activity · private albums</div><button class="btn ghost" style="margin-top:12px" onclick="openM('privacy')">Manage privacy</button></div><div class="grid"><div class="tile"><b>🧭 Relationship Compass</b><span>Compare goals, communication and lifestyle preferences.</span></div><div class="tile"><b>🌡️ Conversation Weather</b><span>Private interaction signals such as stalled or balanced conversation.</span></div><div class="tile"><b>🤝 Kindness Signal</b><span>Private post-date feedback on respect and boundaries.</span></div><div class="tile"><b>✨ Serendipity Mode</b><span>One surprise discovery outside your usual filters.</span></div></div>'}
function openProfile(i){let p=people[i%people.length];openM('profile',p)}
function openM(type,p){let b=document.getElementById('modalBody');if(type==='room'){b.innerHTML=roomUI();document.getElementById('modal').classList.add('open');return}if(type==='game'){b.innerHTML=game();document.getElementById('modal').classList.add('open');return}let map={profile:`<h2>${p.n}, ${p.a} ✓</h2><div class="profilehead"><div class="bigav">${p.i}</div><div><b>${p.c}</b><div class="sub">${p.score}% compatibility · verified</div></div></div><p class="sub">Interests: ${p.tags.join(' · ')}</p><p class="sub">Met through a Cuddl activity? Tap Spark to continue the connection.</p><div class="actions"><button class="btn" onclick="like();closeM()">♥ Send Spark</button><button class="btn ghost" onclick="toast('Chat request opened');closeM()">Message</button></div>`,roulette:'<h2>🎲 Social Roulette</h2><p class="sub">Cuddl will place you with compatible people for a short, low-pressure activity. Profiles remain visible as circles and can be opened anytime.</p><button class="btn" onclick="joinRoom(\'10-Minute Tic-Tac-Toe Mixer\',\'games\')">Join a room</button>',create:'<h2>+ Create a room</h2><p class="sub">Host an activity for people nearby or from your interests.</p><div class="grid"><button class="tile" onclick="joinRoom(\'My Ludo Night\',\'games\')">🎲 Ludo</button><button class="tile" onclick="joinRoom(\'My Karaoke Night\',\'music\')">🎤 Karaoke</button><button class="tile" onclick="joinRoom(\'My Chess Café\',\'games\')">♟️ Chess</button><button class="tile" onclick="joinRoom(\'Open Mic\',\'music\')">🎶 Open Mic</button></div>',truth:'<h2>💬 Truth & Dare</h2><p class="sub">Safe mode prompts only. No sexual or coercive dares.</p><div class="panel"><b>Truth</b><p class="sub">What small thing instantly makes your day better?</p></div><button class="btn" onclick="toast(\'Next prompt\')">Next</button>',wingman:'<h2>✦ AI Wingman</h2><p class="sub">A suggestion based on shared interests:</p><div class="panel"><b>“You both love music — what song would you put on for a perfect road trip?”</b></div><button class="btn" onclick="toast(\'Opener copied\');closeM()">Use opener</button>',capsule:'<h2>💌 Date Capsule</h2><p class="sub">Question: “What makes you feel most cared for?” Your answer stays sealed until both people complete the date.</p><button class="btn" onclick="toast(\'Capsule sealed 💌\');closeM()">Seal answer</button>',verify:'<h2>✓ Verification</h2><p class="sub">Phone, selfie/photo, ID and optional professional verification can contribute to a public verification badge. Sensitive documents remain private.</p><button class="btn" onclick="toast(\'Verification flow started\');closeM()">Start</button>',privacy:'<h2>Privacy controls</h2><div class="panel"><b>Screenshot protection</b><p class="sub">Native apps can block screenshots on supported devices; web browsers cannot guarantee capture prevention.</p></div><div class="panel"><b>Incognito</b><p class="sub">Only people you like can discover you.</p></div><div class="panel"><b>Block contacts</b><p class="sub">Keep selected contacts from discovering your profile.</p></div>',safety:'<h2>🛟 Safety Center</h2><div class="panel"><b>Share Date</b><p class="sub">Share venue, time and safety status with a trusted contact without exposing your phone number.</p></div><div class="panel"><b>Report / Block / Unmatch</b><p class="sub">Available in profiles, chat and live rooms. Hosts can remove participants.</p></div><p class="sub">Never send money, passwords or sensitive documents to a match. Cuddl safety systems provide signals, not guarantees.</p>'};b.innerHTML=map[type]||'';document.getElementById('modal').classList.add('open')}
function closeM(){document.getElementById('modal').classList.remove('open')}
function safety(){openM('safety')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
render();
</script></body></html>
