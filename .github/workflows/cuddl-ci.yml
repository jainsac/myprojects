name: Cuddl CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build application without database migration
        run: npm run build:app

# Keep the master push as a real Git event for the connected Vercel project.
# Vercel production deploys from master.
# Verify the latest Cuddl source before deployment.
# Final deployment trigger (merge, JSX fix): 2026-10-03T18:08:49.518Z

      - name: Vercel production fallback deploy
        if: success() && env.VERCEL_TOKEN != ''
        run: npx vercel@latest --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_O22tTl8VaX7mV8XFUO3UpeOp
          VERCEL_PROJECT_ID: prj_WUxb47EHHuD0MeqBtrZTSzjsFAZh
